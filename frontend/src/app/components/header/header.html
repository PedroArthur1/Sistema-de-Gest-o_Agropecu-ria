<header class="app-header">
  <div class="header-left">
    <h1 class="page-title">{{ pageTitle }}</h1>
  </div>
  <div class="header-right">
    
    <div class="notification-container" routerLink="/dashboard/vacinacao" title="Lembretes de Vacinação" *ngIf="notificacoes$ | async as estado">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bell-icon">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge" *ngIf="estado.totalGeralAtivas > 0">
        {{ estado.totalGeralAtivas }}
      </span>
    </div>

    <div class="user-info">
      <span class="role-badge" *ngIf="userName || role">Perfil: {{ userName || role }}</span>
    </div>
    <button type="button" class="btn-logout" (click)="onLogout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Sair
    </button>
  </div>
</header>
