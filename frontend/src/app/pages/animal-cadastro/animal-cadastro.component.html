<div class="pagina-cadastro">
  <!-- Cabeçalho da página -->
  <app-cabecalho-pagina
    titulo="Cadastrar Novo Animal"
    subtitulo="Preencha os dados do animal para registrá-lo no sistema."
    icone="🐄"
  >
    <button type="button" class="btn-voltar" (click)="voltar()">← Voltar</button>
  </app-cabecalho-pagina>

  <!-- Alertas de feedback -->
  <app-alerta-mensagem [mensagem]="mensagemSucesso" tipo="sucesso"></app-alerta-mensagem>
  <app-alerta-mensagem [mensagem]="mensagemErro" tipo="erro"></app-alerta-mensagem>

  <!-- Card do formulário -->
  <div class="formulario-card">
    <form [formGroup]="formularioAnimal" (ngSubmit)="cadastrar()">
      <div class="formulario-grid">
        <!-- Código de Identificação -->
        <app-campo-formulario
          label="Código de Identificação"
          tipo="text"
          campoId="codigoIdentificacao"
          placeholder="Ex: BOV-2026-001"
          [obrigatorio]="true"
          [invalido]="campoInvalido('codigoIdentificacao')"
          mensagemErro="O código de identificação é obrigatório (mínimo 2 caracteres)."
          formControlName="codigoIdentificacao"
        ></app-campo-formulario>

        <!-- Espécie -->
        <app-campo-formulario
          label="Espécie"
          tipo="select"
          campoId="especie"
          placeholder="Selecione a espécie"
          [obrigatorio]="true"
          [opcoes]="especiesDisponiveis"
          [invalido]="campoInvalido('especie')"
          mensagemErro="Selecione a espécie do animal."
          formControlName="especie"
        ></app-campo-formulario>

        <!-- Raça -->
        <app-campo-formulario
          label="Raça"
          tipo="text"
          campoId="raca"
          placeholder="Ex: Nelore, Angus, Holandesa"
          [obrigatorio]="true"
          [invalido]="campoInvalido('raca')"
          mensagemErro="A raça é obrigatória."
          formControlName="raca"
        ></app-campo-formulario>

        <!-- Sexo -->
        <app-campo-formulario
          label="Sexo"
          tipo="select"
          campoId="sexo"
          placeholder="Selecione o sexo"
          [obrigatorio]="true"
          [opcoes]="['Macho', 'Fêmea']"
          [invalido]="campoInvalido('sexo')"
          mensagemErro="Selecione o sexo do animal."
          formControlName="sexo"
        ></app-campo-formulario>

        <!-- Data de Nascimento / Idade -->
        <app-campo-formulario
          label="Data de Nascimento / Idade"
          tipo="text"
          campoId="dataNascimentoOuIdade"
          placeholder="Ex: 2024-05-10 ou '2 anos'"
          [obrigatorio]="true"
          [invalido]="campoInvalido('dataNascimentoOuIdade')"
          mensagemErro="Informe a data de nascimento ou idade aproximada."
          formControlName="dataNascimentoOuIdade"
        ></app-campo-formulario>

        <!-- Peso -->
        <app-campo-formulario
          label="Peso (kg)"
          tipo="number"
          campoId="peso"
          placeholder="Ex: 450.5"
          step="0.1"
          [obrigatorio]="true"
          [invalido]="campoInvalido('peso')"
          mensagemErro="O peso deve ser um valor numérico positivo."
          formControlName="peso"
        ></app-campo-formulario>

        <!-- Condição de Saúde -->
        <div class="campo-largura-total">
          <app-campo-formulario
            label="Condição de Saúde"
            tipo="select"
            campoId="condicaoSaude"
            placeholder="Selecione a condição de saúde"
            [obrigatorio]="true"
            [opcoes]="condicoesSaude"
            [invalido]="campoInvalido('condicaoSaude')"
            mensagemErro="A condição de saúde é obrigatória."
            formControlName="condicaoSaude"
          ></app-campo-formulario>
        </div>

        <!-- Observações -->
        <div class="campo-largura-total">
          <app-campo-formulario
            label="Observações Adicionais (Opcional)"
            tipo="textarea"
            campoId="observacoes"
            placeholder="Informações adicionais sobre o histórico, vacinação ou alimentação..."
            [obrigatorio]="false"
            [linhas]="3"
            formControlName="observacoes"
          ></app-campo-formulario>
        </div>
      </div>

      <!-- Botões de ação -->
      <div class="acoes-formulario">
        <app-botao-acao
          texto="Cancelar"
          tipo="cancelar"
          (aoClicar)="voltar()"
        ></app-botao-acao>
        <app-botao-acao
          [texto]="estaEnviando ? 'Cadastrando...' : 'Cadastrar Animal'"
          tipo="primario"
          [tipoSubmit]="true"
          [desabilitado]="estaEnviando"
        ></app-botao-acao>
      </div>
    </form>
  </div>
</div>
