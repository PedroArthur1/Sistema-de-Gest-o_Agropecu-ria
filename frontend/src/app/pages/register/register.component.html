<div class="auth-container">
    <div class="auth-card">
        <h2>Criar Nova Conta</h2>
        <p class="subtitle">Preencha os dados abaixo para se cadastrar</p>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" [(ngModel)]="userData.nome" required
                    placeholder="Seu nome completo" />
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" [(ngModel)]="userData.email" required
                    placeholder="seu@email.com" />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" [(ngModel)]="userData.password" required
                    placeholder="••••••••" />
            </div>

            <div class="form-group">
                <label for="role">Tipo de Perfil (Role)</label>
                <select id="role" name="role" [(ngModel)]="userData.role" required>
                    <option value="USER">Usuário Comum (USER)</option>
                    <option value="ADMIN">Administrador (ADMIN)</option>
                </select>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="!registerForm.form.valid">
                Cadastrar
            </button>
        </form>

        <div class="auth-footer">
            <p>Já possui uma conta? <a routerLink="/login">Faça Login</a></p>
        </div>
    </div>
</div>
