<div class="auth-container">
    <div class="auth-card">
        <h2>Sistema Agropecuário</h2>
        <p class="subtitle">Faça login para acessar a plataforma</p>

        <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required #emailField="ngModel"
                    placeholder="seu@email.com" />
                <span class="field-error" *ngIf="(emailField.touched || submitted) && emailField.invalid">
                    Por favor, informe um e-mail válido.
                </span>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required #passwordField="ngModel"
                    placeholder="••••••••" />
                <span class="field-error" *ngIf="(passwordField.touched || submitted) && passwordField.invalid">
                    Por favor, informe sua senha.
                </span>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Ainda não tem conta? <a routerLink="/register">Cadastre-se</a></p>
        </div>
    </div>
</div>
