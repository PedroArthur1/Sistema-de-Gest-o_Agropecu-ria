<div class="auth-container">
    <div class="auth-card">
        <h2>Sistema Agropecuário</h2>
        <p class="subtitle">Faça login para acessar a plataforma</p>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required
                    placeholder="seu@email.com" />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required
                    placeholder="••••••••" />
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="!loginForm.form.valid">
                Entrar
            </button>
        </form>

        <div class="auth-footer">
            <p>Ainda não tem conta? <a routerLink="/register">Cadastre-se</a></p>
        </div>
    </div>
</div>
