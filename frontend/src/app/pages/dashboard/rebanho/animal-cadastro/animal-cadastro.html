<div class="cadastro-container">
  
  <!-- Breadcrumbs -->
  <nav class="breadcrumbs">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    <span class="separator">></span>
    <span class="crumb" (click)="voltar()">Rebanho</span>
    <span class="separator">></span>
    <span class="crumb active">Cadastrar Animal</span>
  </nav>

  <!-- Cabeçalho Principal -->
  <div class="page-header">
    <div class="title-row">
      <button class="btn-back-icon" (click)="voltar()" title="Voltar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <h2>Cadastrar Animal</h2>
    </div>
    <p class="subtitle">Preencha as informações básicas para registrar um novo animal no rebanho.</p>
  </div>

  <!-- Alertas -->
  <div class="alert alert-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="alert alert-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="cadastro-card">
    <!-- Formulário -->
    <form [formGroup]="animalForm" (ngSubmit)="onSubmit()" class="form-container">
      
      <div class="form-grid">
        <div class="form-group">
          <label>Código de Identificação *</label>
          <input type="text" formControlName="codigoIdentificacao" placeholder="Ex: BOV-001 (ou gerado ao escolher a espécie)" />
          <span class="error-text" *ngIf="animalForm.get('codigoIdentificacao')?.touched && animalForm.get('codigoIdentificacao')?.invalid">
            Obrigatório
          </span>
        </div>

        <div class="form-group">
          <label>Espécie *</label>
          <select formControlName="especie">
            <option value="">Selecione...</option>
            <option value="Bovino">Bovino</option>
            <option value="Suíno">Suíno</option>
            <option value="Equino">Equino</option>
            <option value="Ovino">Ovino</option>
            <option value="Outro">Outro</option>
          </select>
          <span class="error-text" *ngIf="animalForm.get('especie')?.touched && animalForm.get('especie')?.invalid">
            Obrigatória
          </span>
        </div>

        <div class="form-group">
          <label>Raça *</label>
          <input type="text" formControlName="raca" placeholder="Ex: Nelore" />
          <span class="error-text" *ngIf="animalForm.get('raca')?.touched && animalForm.get('raca')?.invalid">
            Obrigatória
          </span>
        </div>

        <div class="form-group">
          <label>Sexo *</label>
          <select formControlName="sexo">
            <option value="">Selecione...</option>
            <option value="Macho">Macho</option>
            <option value="Fêmea">Fêmea</option>
          </select>
          <span class="error-text" *ngIf="animalForm.get('sexo')?.touched && animalForm.get('sexo')?.invalid">
            Obrigatório
          </span>
        </div>

        <div class="form-group">
          <label>Data de Nascimento *</label>
          <input type="date" formControlName="dataNascimentoOuIdade" />
          <span class="error-text" *ngIf="animalForm.get('dataNascimentoOuIdade')?.touched && animalForm.get('dataNascimentoOuIdade')?.invalid">
            Obrigatória
          </span>
        </div>

        <div class="form-group">
          <label>Peso (kg) *</label>
          <input type="number" formControlName="peso" placeholder="Ex: 450" />
          <span class="error-text" *ngIf="animalForm.get('peso')?.touched && animalForm.get('peso')?.invalid">
            Obrigatório
          </span>
        </div>

        <div class="form-group">
          <label>Condição de Saúde *</label>
          <select formControlName="condicaoSaude">
            <option value="">Selecione...</option>
            <option value="Saudável">Saudável</option>
            <option value="Em Observação">Em Observação</option>
            <option value="Em Tratamento">Em Tratamento</option>
          </select>
          <span class="error-text" *ngIf="animalForm.get('condicaoSaude')?.touched && animalForm.get('condicaoSaude')?.invalid">
            Obrigatória
          </span>
        </div>

        <div class="form-group">
          <label>Lote / Grupo de Rebanho (Opcional)</label>
          <select formControlName="grupoId">
            <option [ngValue]="null">Nenhum (Animal Individual)</option>
            <option *ngFor="let lote of lotes" [ngValue]="lote.id">{{ lote.nome }}</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Observações Adicionais (Opcional)</label>
          <input type="text" formControlName="observacoes" placeholder="Insira quaisquer detalhes extras aqui..." />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="voltar()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Salvando...' : 'Salvar Cadastro' }}
        </button>
      </div>

    </form>
  </div>
</div>
