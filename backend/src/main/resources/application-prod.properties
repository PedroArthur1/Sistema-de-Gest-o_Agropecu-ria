spring.application.name=agrogestao-api

server.port=${PORT:8080}

api.security.token.secret=${JWT_SECRET}

# URL/user/pass vêm de ProductionDataSourceConfig (env DB_* ou DATABASE_URL).
# Nao defina SPRING_DATASOURCE_URL com texto ${DB_HOST} no Render.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=${FRONTEND_URL:https://sistema-agropecuaria-web.onrender.com}
